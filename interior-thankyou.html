<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | TRIO Interiors</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#111827);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
max-width:700px;
width:100%;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
padding:50px;
text-align:center;
color:white;
}

h1{
font-size:42px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.7;
color:#ddd;
margin-bottom:15px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:14px 30px;
background:#d4af37;
color:#000;
text-decoration:none;
font-weight:bold;
border-radius:10px;
}

.btn:hover{
background:#f5c842;
}

.contact{
margin-top:25px;
color:#aaa;
}

@media(max-width:768px){
h1{
font-size:30px;
}
p{
font-size:16px;
}
.container{
padding:30px 20px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>Design Request Submitted ✅</h1>

<p>
Thank you for contacting TRIO Interiors.
</p>

<p>
Our design team will review your requirements
and get back to you shortly.
</p>

<a href="Interior.html" class="btn">
Back to Interior Page
</a>

<div class="contact">
📞 +91 9987570309
</div>

</div>
<div class="cursor"></div>

<script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/04/09/06/20260409060544-DG066HXA.js" defer></script>
<div id="certificateModal" class="certificate-modal">

    <div class="certificate-content">

        <span class="close-btn" onclick="closeCertificate()">&times;</span>

        <h2>"Your Trusted Exhibition Partner in India"</h2>

        <div class="certificate-row">

            <!-- Certificate 1 -->
            <img src="trio-website/Projects/image/cer1.jpg"
                 alt="Certificate 1"
                 class="certificate-img"
                 onclick="openCertificateViewer(this.src)">

            <!-- Flags -->
            <div class="flags">

                <div class="flag-item">
                    <img src="trio-website/Projects/image/china.png" alt="India">
                    <span>China</span>
                </div>

                <div class="flag-item">
                    <img src="trio-website/Projects/image/India.jpg" alt="Germany">
                    <span>India</span>
                </div>

                <div class="flag-item">
                    <img src="trio-website/Projects/image/korea.jpg" alt="USA">
                    <span>Korea</span>
                </div>

            </div>

            <!-- Certificate 2 -->
            <img src="trio-website/Projects/image/cer2.jpg"
                 alt="Certificate 2"
                 class="certificate-img"
                 onclick="openCertificateViewer(this.src)">

        </div>

        <!-- Certificate 3 -->
        <div class="bottom-certificate">
            <img src="trio-website/Projects/image/cer3.jpg"
                 alt="Certificate 3"
                 class="certificate-img"
                 onclick="openCertificateViewer(this.src)">
        </div>

    </div>

</div>

<!-- Full Screen Certificate Viewer -->
<div id="certificateViewer" class="certificate-viewer">

    <span class="viewer-close" onclick="closeCertificateViewer()">&times;</span>

    <img id="viewerImage" src="" alt="Certificate">

</div>
</body>
</html>
